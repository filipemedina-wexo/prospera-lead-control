server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        # O entrypoint injeta as variáveis públicas do Supabase após o build.
        # O hash do Vite, portanto, não muda quando uma origem é trocada no
        # Easypanel; revalidar evita o navegador continuar com a API antiga.
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
