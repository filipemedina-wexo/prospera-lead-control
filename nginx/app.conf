server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # A aplicação manipula dados pessoais: impeça execução/origens inesperadas
    # e o encaixe do CRM em iframes de terceiros.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://otngjqmezjvdlugqdsej.supabase.co wss://otngjqmezjvdlugqdsej.supabase.co" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        # O entrypoint injeta as variáveis públicas do Supabase após o build.
        # O hash do Vite, portanto, não muda quando uma origem é trocada no
        # Easypanel; revalidar evita o navegador continuar com a API antiga.
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
